packages:
  - apps/*
  - packages/*

# native build scripts. the ones set to false have pure-js fallbacks or are for
# hardware wallets we don't use.
allowBuilds:
  esbuild: true
  sharp: true
  keccak: true
  blake-hash: true
  tiny-secp256k1: true
  protobufjs: true
  usb: false
  "@reown/appkit": false
  "@stellar/stellar-sdk": false
